AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-lab application layer - internet-facing Application Load Balancer in
  public subnets fronting an Auto Scaling group of nginx instances in private
  subnets. Imports networking from the network stack.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Tagging
        Parameters:
          - ProjectName
          - Environment
          - Owner
          - CostCenter
      - Label:
          default: Compute
        Parameters:
          - InstanceType
          - LatestAmiId
          - MinSize
          - MaxSize
          - DesiredCapacity
          - TargetCpuUtilization
      - Label:
          default: Load balancer
        Parameters:
          - HealthCheckPath

Parameters:
  ProjectName:
    Type: String
    Default: aws-lab
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Must match the ProjectName used for the network stack.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the Environment used for the network stack.
  Owner:
    Type: String
    Default: platform-team
    Description: Team or person responsible for these resources.
  CostCenter:
    Type: String
    Default: CC-1001
    Description: Cost center used for billing allocation.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type for the web tier.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Public SSM parameter that resolves to the latest Amazon Linux 2023 AMI.
  MinSize:
    Type: Number
    Default: 2
    MinValue: 0
    Description: Minimum number of instances (2 keeps one per AZ).
  MaxSize:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Maximum number of instances.
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 0
    Description: Initial desired number of instances.
  TargetCpuUtilization:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90
    Description: Average CPU percentage the target tracking policy aims for.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: HTTP path the target group uses for health checks.

Resources:
  # -------------------------------------------------------- security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the internet to the ALB
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      SecurityGroupIngress:
        - Description: HTTP from anywhere
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-alb-sg
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to web instances only from the ALB
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      SecurityGroupIngress:
        - Description: HTTP from the ALB security group only
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-web-sg
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  # ------------------------------------------------------------------- IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Web tier instance role - SSM Session Manager and CloudWatch agent
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --------------------------------------------------------- load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  # HTTP only to keep the lab free of a domain/ACM dependency. In a real
  # environment add an HTTPS listener with an ACM certificate and redirect
  # port 80 to 443.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- compute
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${ProjectName}-${Environment}-web
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: !Ref Environment
            - Key: Owner
              Value: !Ref Owner
            - Key: CostCenter
              Value: !Ref CostCenter
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        Monitoring:
          Enabled: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 8
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${ProjectName}-${Environment}-web
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: !Ref Environment
              - Key: Owner
                Value: !Ref Owner
              - Key: CostCenter
                Value: !Ref CostCenter
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: !Ref Environment
              - Key: Owner
                Value: !Ref Owner
              - Key: CostCenter
                Value: !Ref CostCenter
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y nginx

            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            cat > /usr/share/nginx/html/index.html <<EOF
            <!doctype html>
            <html>
              <head><title>${ProjectName} (${Environment})</title></head>
              <body>
                <h1>${ProjectName} - ${Environment}</h1>
                <p>Served by $INSTANCE_ID in $AZ</p>
              </body>
            </html>
            EOF

            echo "ok" > /usr/share/nginx/html/health

            systemctl enable --now nginx

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${ProjectName}-${Environment}-web-asg
      VPCZoneIdentifier: !Split
        - ","
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: false
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: false
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: false
        - Key: CostCenter
          Value: !Ref CostCenter
          PropagateAtLaunch: false
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
        WaitOnResourceSignals: false

  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 180
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization

Outputs:
  LoadBalancerDnsName:
    Description: Public DNS name of the Application Load Balancer
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlbDnsName
  LoadBalancerUrl:
    Description: URL of the web application
    Value: !Sub http://${LoadBalancer.DNSName}
  LoadBalancerFullName:
    Description: ALB full name, used as the LoadBalancer CloudWatch dimension
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlbFullName
  TargetGroupFullName:
    Description: Target group full name, used as the TargetGroup CloudWatch dimension
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-TargetGroupFullName
  AutoScalingGroupName:
    Description: Name of the web tier Auto Scaling group
    Value: !Ref AutoScalingGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AsgName
  InstanceSecurityGroupId:
    Description: Security group attached to web instances
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-WebSgId
