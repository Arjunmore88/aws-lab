AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-lab monitoring layer - SNS alert topic with email subscription,
  CloudWatch alarms for the ALB and Auto Scaling group, and an operations
  dashboard. Imports resource identifiers from the app stack.

Parameters:
  ProjectName:
    Type: String
    Default: aws-lab
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Must match the ProjectName used for the app stack.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Must match the Environment used for the app stack.
  Owner:
    Type: String
    Default: platform-team
    Description: Team or person responsible for these resources.
  CostCenter:
    Type: String
    Default: CC-1001
    Description: Cost center used for billing allocation.
  AlertEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be empty or a valid email address.
    Description: >-
      Email address subscribed to the alert topic. AWS sends a confirmation
      email that must be accepted before alerts are delivered. Leave empty
      to skip the subscription.
  Alb5xxThreshold:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Number of ELB plus target 5xx responses per minute that triggers an alarm.
  CpuHighThreshold:
    Type: Number
    Default: 80
    MinValue: 10
    MaxValue: 100
    Description: Average ASG CPU percentage that triggers an alarm.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${Environment}-alerts
      DisplayName: !Sub ${ProjectName} ${Environment} alerts
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter

  # Only CloudWatch alarms in this account may publish. Note: the topic is not
  # encrypted with the AWS managed key (alias/aws/sns) because CloudWatch cannot
  # use that key; production setups should use a customer managed KMS key whose
  # key policy grants cloudwatch.amazonaws.com kms:Decrypt/GenerateDataKey*.
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ------------------------------------------------------------------ alarms
  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-alb-5xx
      AlarmDescription: >-
        ALB is returning 5xx responses (generated by the ALB or by targets).
        Runbook: runbooks/alb-5xx-errors.md
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: !Ref Alb5xxThreshold
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      TreatMissingData: notBreaching
      Metrics:
        - Id: total5xx
          Label: Total 5xx
          Expression: elb5xx + target5xx
          ReturnData: true
        - Id: elb5xx
          ReturnData: false
          MetricStat:
            Period: 60
            Stat: Sum
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-AlbFullName
        - Id: target5xx
          ReturnData: false
          MetricStat:
            Period: 60
            Stat: Sum
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-AlbFullName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-unhealthy-hosts
      AlarmDescription: >-
        One or more targets are failing ALB health checks.
        Runbook: runbooks/asg-unhealthy-instances.md
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-AlbFullName
        - Name: TargetGroup
          Value: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  AsgCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-asg-cpu-high
      AlarmDescription: >-
        Average CPU across the web Auto Scaling group is high even after
        target tracking - check whether MaxSize has been reached.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-AsgName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref CpuHighThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # --------------------------------------------------------------- dashboard
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectName}-${Environment}-operations
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "ALB requests",
                  "region": "${AWS::Region}",
                  "stat": "Sum", "period": 60, "view": "timeSeries",
                  "metrics": [
                    ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${AlbFullName}"]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "ALB 4xx / 5xx",
                  "region": "${AWS::Region}",
                  "stat": "Sum", "period": 60, "view": "timeSeries",
                  "metrics": [
                    ["AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${AlbFullName}"],
                    [".", "HTTPCode_Target_5XX_Count", ".", "."],
                    [".", "HTTPCode_Target_4XX_Count", ".", "."]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Target response time (p95, seconds)",
                  "region": "${AWS::Region}",
                  "stat": "p95", "period": 60, "view": "timeSeries",
                  "metrics": [
                    ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${AlbFullName}"]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Healthy vs unhealthy targets",
                  "region": "${AWS::Region}",
                  "stat": "Maximum", "period": 60, "view": "timeSeries",
                  "metrics": [
                    ["AWS/ApplicationELB", "HealthyHostCount", "LoadBalancer", "${AlbFullName}", "TargetGroup", "${TgFullName}"],
                    [".", "UnHealthyHostCount", ".", ".", ".", "."]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
                "properties": {
                  "title": "ASG average CPU (%)",
                  "region": "${AWS::Region}",
                  "stat": "Average", "period": 300, "view": "timeSeries",
                  "metrics": [
                    ["AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AsgName}"]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
                "properties": {
                  "title": "ASG instances in service",
                  "region": "${AWS::Region}",
                  "stat": "Average", "period": 60, "view": "timeSeries",
                  "metrics": [
                    ["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${AsgName}"],
                    [".", "GroupDesiredCapacity", ".", "."]
                  ]
                }
              },
              {
                "type": "alarm", "x": 0, "y": 18, "width": 24, "height": 3,
                "properties": {
                  "title": "Alarm status",
                  "alarms": [
                    "${Alb5xxAlarm.Arn}",
                    "${UnhealthyHostsAlarm.Arn}",
                    "${AsgCpuHighAlarm.Arn}"
                  ]
                }
              }
            ]
          }
        - AlbFullName: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-AlbFullName
          TgFullName: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-TargetGroupFullName
          AsgName: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-AsgName

Outputs:
  AlertTopicArn:
    Description: ARN of the SNS alert topic
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlertTopicArn
  DashboardUrl:
    Description: Link to the CloudWatch operations dashboard
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OperationsDashboard}
